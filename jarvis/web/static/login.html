<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis sign-in</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png" type="image/png">
<meta name="theme-color" content="#0f1216">
<link rel="stylesheet" href="/themes.css">
<script src="/theme.js"></script>
<style>
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 14px system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; box-sizing: border-box; }
.box { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 28px; width: 100%; max-width: 360px; box-sizing: border-box; }
.logo { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
.logo img { width: 40px; height: 40px; border-radius: 10px; }
h1 { margin: 0; font-size: 20px; letter-spacing: .5px; } p { color: var(--muted); margin: 0 0 18px; }
.sso { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 12px; border-radius: 10px; background: var(--accent); color: var(--accent-text); text-decoration: none; font-weight: 600; font-size: 15px; margin-bottom: 10px; }
.sso.alt { background: var(--panel2); color: var(--text); border: 1px solid var(--line); }
.sso svg { width: 18px; height: 18px; flex: none; }
input { width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; margin-bottom: 10px; }
button { width: 100%; padding: 10px; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-text); font: inherit; font-weight: 600; cursor: pointer; }
.toggle { background: none; color: var(--muted); padding: 6px; margin-top: 6px; font-weight: 500; }
.toggle:hover { color: var(--text); }
.err { background: color-mix(in srgb, var(--crit) 15%, transparent); border-radius: 8px; padding: 8px 10px; margin-bottom: 14px; }
.foot { color: var(--muted); font-size: 12px; margin-top: 16px; text-align: center; }
</style>
</head>
<body>
<div class="box">
  <div class="logo"><img src="/icon-192.png" alt=""><h1>JARVIS</h1></div>
  <p id="lead">Sign in to your Jarvis.</p>
  <div id="err" class="err" hidden></div>
  <div id="ssobox"></div>
  <form method="post" action="/login" id="pw">
    <input name="username" placeholder="Username" autocomplete="username" autocapitalize="none" spellcheck="false">
    <input type="password" name="password" placeholder="Password" autocomplete="current-password" required>
    <button>Sign in</button>
  </form>
  <button type="button" class="toggle" id="toggle" hidden></button>
  <div class="foot" id="foot">Got an invitation? Open the link in the email to create your account.</div>
</div>
<script>
const $ = s => document.querySelector(s);
const q = new URLSearchParams(location.search);
if (q.get("error")) { $("#err").hidden = false;
  $("#err").textContent = q.get("error") === "sso" ? "Please sign in with single sign-on." : "Wrong username or password."; }
const key = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M10.8 12.2 20 3M17 6l3 3M15 8l2 2"/></svg>';
fetch("/auth/info").then(r => r.json()).then(d => {
  const ps = d.providers || [];
  if (!ps.length) return;  // passwords only
  const box = $("#ssobox");
  ps.forEach((p, i) => {
    const a = document.createElement("a");
    a.className = "sso" + (i ? " alt" : ""); a.href = "/auth/sso?p=" + encodeURIComponent(p.key);
    a.innerHTML = key; a.append("Sign in with " + p.label);
    box.append(a);
  });
  // single sign-on first: the password form folds away
  const pw = $("#pw"), t = $("#toggle");
  pw.hidden = !q.get("error") || q.get("error") === "sso";
  t.hidden = false;
  const label = () => t.textContent = pw.hidden ? (d.password_login ? "Sign in with a password instead" : "Admin sign-in with a password") : "Hide password sign-in";
  label();
  t.onclick = () => { pw.hidden = !pw.hidden; label(); if (!pw.hidden) pw.querySelector("input").focus(); };
}).catch(() => {});
</script>
</body>
</html>
