<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis login</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png" type="image/png">
<meta name="theme-color" content="#0f1216">
<style>
:root { --bg: #f4f5f7; --panel: #fff; --text: #1b1f24; --muted: #667085; --line: #e4e7ec; --accent: #2563eb; }
@media (prefers-color-scheme: dark) { :root { --bg: #0f1216; --panel: #171b21; --text: #e6e8eb; --muted: #98a2b3; --line: #2a313b; --accent: #3b82f6; } }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 14px system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; }
form { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 28px; width: 100%; max-width: 340px; }
h1 { margin: 0 0 4px; font-size: 20px; } p { color: var(--muted); margin: 0 0 18px; }
input { width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; margin-bottom: 12px; }
button { width: 100%; padding: 10px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>Jarvis</h1>
  <p>Enter the dashboard password.</p>
  <input type="password" name="password" autofocus autocomplete="current-password" required>
  <button>Log in</button>
</form>
</body>
</html>
