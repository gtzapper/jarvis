services:
  jarvis:
    build: .
    image: jarvis:latest
    container_name: jarvis
    restart: unless-stopped
    # The user that owns ./config on the host. Unraid usually wants 99:100.
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "8765:8765"
    environment:
      TZ: "${TZ:-UTC}"   # e.g. Asia/Kolkata or Europe/London, so alert and audit times are local
    volumes:
      # Jarvis's own config.yaml, .env (keys and passwords), data/ and .ssh/ key all live here.
      - ./config:/config
