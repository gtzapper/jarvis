services:
  jarvis:
    build: .
    image: jarvis:latest
    container_name: jarvis
    # Restarts after crashes and reboots, and after an in-app update (Jarvis exits so it comes back on the new code).
    restart: unless-stopped
    # The owner of this folder on the host (install.sh sets it). Unraid usually wants 99:100.
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${JARVIS_PORT:-8765}:8765"
    environment:
      TZ: "${TZ:-UTC}"   # e.g. Asia/Kolkata or Europe/London, so alert and audit times are local
    volumes:
      # The git checkout itself: lets Jarvis update its own code from GitHub.
      - .:/app
      # Jarvis's config.yaml, .env (keys and passwords), data/ and .ssh/ key.
      - ./config:/config
    networks:
      default:
      edge:
        ipv4_address: 172.31.250.2

  # Optional: speech for "Hey Jarvis" (Whisper speech-to-text + Kokoro voice), on the CPU.
  # Start it with:  docker compose --profile voice up -d
  # Then Setup > Voice keeps the default address http://voice:8000. Models download on the first Save & test.
  # Have a GPU elsewhere? Run ghcr.io/speaches-ai/speaches:latest-cuda there instead and put its address in Setup > Voice.
  voice:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    container_name: jarvis-voice
    profiles: ["voice"]
    restart: unless-stopped
    environment:
      ENABLE_UI: "false"
      WHISPER__COMPUTE_TYPE: "int8"
      STT_MODEL_TTL: "-1"   # keep the speech model loaded: the first command after idle shouldn't wait for it
      TTS_MODEL_TTL: "-1"
    volumes:
      - voice-models:/home/ubuntu/.cache/huggingface/hub   # a Docker volume, so file ownership just works

  # Optional: private web search for research ("search the web for ...").
  # Start it with:  docker compose --profile search up -d     (Setup > Web search keeps http://searxng:8080)
  searxng:
    image: searxng/searxng:latest
    container_name: jarvis-search
    profiles: ["search"]
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: "http://searxng:8080/"
      SEARXNG_SECRET: "${SEARXNG_SECRET:-set-a-long-random-value-in-.env}"
    volumes:
      - ./docker/searxng:/etc/searxng

  # Optional: reach Jarvis from the internet through a Cloudflare Tunnel (no ports opened on your router).
  # Better first: a VPN (WireGuard on pfSense, or Tailscale). If you do use this:
  #   1. Cloudflare Zero Trust > Networks > Tunnels > Create, pick Docker, copy the token into .env as CLOUDFLARE_TUNNEL_TOKEN.
  #      Public hostname: jarvis.example.com -> http://jarvis:8765
  #   2. Strongly recommended: Zero Trust > Access > Applications: put a login (email code, Google or your Authentik) in front.
  #   3. Jarvis Setup > Internet access & security > Reverse proxy addresses: 172.31.250.3
  #   4. docker compose --profile tunnel up -d
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: jarvis-tunnel
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: "${CLOUDFLARE_TUNNEL_TOKEN:-}"
    networks:
      edge:
        ipv4_address: 172.31.250.3

networks:
  # a tiny private network so a tunnel or proxy has one known address Jarvis can trust
  edge:
    ipam:
      config:
        - subnet: 172.31.250.0/29

volumes:
  voice-models:
