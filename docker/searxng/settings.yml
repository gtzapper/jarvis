# SearXNG for Jarvis: private web search. Only Jarvis talks to it (no port is published).
use_default_settings: true
general:
  instance_name: "Jarvis search"
search:
  safe_search: 1
  formats:
    - html
    - json        # Jarvis reads results as JSON
server:
  limiter: false  # only Jarvis uses it
  image_proxy: false
  public_instance: false
  # the secret comes from SEARXNG_SECRET in docker-compose.yml
